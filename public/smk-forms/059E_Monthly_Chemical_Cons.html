<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>059-E Monthly Chemical Cons</title>
<style>
  body { font-family: 'Arial', sans-serif; font-size: 11px; margin: 0; padding: 20px; color: #333; background: #fff; }
  * { box-sizing: border-box; }
  .page { max-width: 900px; margin: 0 auto; background: #fff; }
  .header { display: flex; flex-direction: column; border: 2px solid #000; padding: 10px; margin-bottom: 20px; }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 2px solid #000; padding-bottom: 10px; }
  .company { font-size: 16px; font-weight: bold; width: 25%; }
  .title { text-align: center; font-size: 16px; font-weight: bold; flex: 1; }
  .status { display: flex; flex-direction: column; align-items: flex-end; width: 25%; font-size: 10px; }
  .status-box { border: 1px solid #000; padding: 2px; display: flex; margin-bottom: 5px; }
  .status-box span { padding: 2px 5px; border-right: 1px solid #000; font-weight: bold; }
  .status-box span:last-child { border-right: none; }
  .meta { display: flex; justify-content: space-between; }
  .field { display: flex; align-items: center; gap: 5px; font-weight: bold; }
  select, input, textarea { border: 1px solid #ccc; font-family: inherit; font-size: inherit; background: transparent; padding: 3px; }
  input.date-mask { width: 100px; text-align: center; }
  input[type="text"] { width: 100%; border: none; outline: none; background: transparent; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
  th, td { border: 1px solid #000; padding: 6px; text-align: center; }
  th { background: #f0f0f0; font-weight: bold; }
  .row-label { text-align: left; font-weight: bold; }
  .editable-head { width: 100%; height: 3em; resize: none; border: none; background: transparent; text-align: center; font-weight: bold; outline: none; font-family: inherit; font-size: inherit;}
  .foot { display: flex; justify-content: space-around; margin-top: 30px; }
  .sign-box { text-align: center; display: flex; flex-direction: column; justify-content: space-between; height: 100px; }
  .sign-line { border-top: 1px solid #000; width: 150px; padding-top: 5px; }
  .btn { padding: 8px 12px; background: #0284c7; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  @media print {
    body { padding: 0; }
    .no-print { display: none !important; }
    input, select, textarea { border: none !important; }
  }

  .sig-space { height: 60px; display: flex; align-items: center; justify-content: center; }
  .sig-preview { position: relative; display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; }
  .sig-preview img { max-height: 50px; max-width: 100%; object-fit: contain; }
  .sig-preview.hidden, .btn.hidden { display: none !important; }
  .remove { position: absolute; top: -5px; right: 0; background: #dc2626; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; cursor: pointer; font-weight: bold; padding: 0; }
  .upload { display: none; }
  .sig-name { border: none; border-bottom: 1px solid #000; outline: none; width: 100%; text-align: center; margin-top: 5px; }
  .role { font-size: 9px; font-weight: bold; margin-top: 2px; }
    
</style>
</head>
<body>
<div class="page">
  <div class="toolbar no-print" style="margin-bottom: 10px;">
    <button class="btn print-btn">🖨 Print / Simpan PDF</button>
  </div>
  
  <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; border: 2px solid #000;">
    <tbody>
      <tr>
        <td rowspan="2" style="width: 25%; font-size: 16px; font-weight: bold; text-align: center; border: 1px solid #000; padding: 10px;">
          PT MENTARI MAS MULTIMODA
        </td>
        <td rowspan="2" style="width: 50%; font-size: 16px; font-weight: bold; text-align: center; border: 1px solid #000; padding: 10px;">
          059-E<br>MONTHLY CHEMICAL - OXYGEN - LPG - ACCYTELIN - NITROGEN CONSUMPTION
        </td>
        <td style="width: 25%; font-size: 10px; font-weight: bold; border: 1px solid #000; padding: 5px; text-align: right;">
          <div style="display: inline-flex; border: 1px solid #000;">
            <span style="padding: 2px 5px; border-right: 1px solid #000;">CS</span>
            <span style="padding: 2px 5px;">BLN</span>
          </div>
        </td>
      </tr>
      <tr>
        <td style="font-size: 10px; border: 1px solid #000; padding: 5px;">
          Release : &nbsp; Rev. 1 :
        </td>
      </tr>
      <tr>
        <td colspan="3" style="border: 1px solid #000; padding: 5px;">
          <div style="display: flex; justify-content: space-between; font-weight: bold;">
            <label style="display: flex; gap: 5px; align-items: center;">MV: 
              <select class="vessel" style="border: 1px solid #ccc; padding: 3px;">
                <option value="">Pilih kapal</option>
                <option>Express Mas</option>
                <option>Mavendra Mas</option>
                <option>Prakarsa Mas</option>
                <option>Pratama Mas</option>
                <option>Semangat Mas</option>
                <option>Segoro Mas</option>
                <option>Sahabat Mas</option>
                <option>Selaras Mas</option>
              </select>
            </label>
            <label style="display: flex; gap: 5px; align-items: center;">Date: 
              <input class="date-mask date" type="text" placeholder="DD-MM-YYYY" style="width: 100px; text-align: center; border: 1px solid #ccc; padding: 3px;">
            </label>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  
  <table>
    <thead>
      <tr>
        <th rowspan="2">KIND OF CHEMICAL</th>
        <th rowspan="2">Satuan</th>
        <th rowspan="2">ROB Last Month</th>
        <th rowspan="2">Last Supply</th>
        <th rowspan="2">Consumption</th>
        <th colspan="2">ROB this month</th>
      </tr>
      <tr>
        <th>FULL</th>
        <th>EMPTY</th>
      </tr>
    </thead>
    <tbody id="rows">
    </tbody>
  </table>

  <div style="margin-top: 20px;">
    <strong>Remarks:</strong>
    <textarea style="width: 100%; height: 60px; border: 1px solid #000; margin-top: 5px;"></textarea>
  </div>

  <section class="foot" id="signatures"></section>
</div>

<script>
const items = [
  {name: 'Oxygen', unit: 'Cylinder'},
  {name: 'Accytelin', unit: 'Cylinder'},
  {name: 'LPG', unit: 'Cylinder'},
  {name: 'Freon R...', unit: 'Cylinder'},
  {name: 'Nitrogen', unit: 'Cylinder'},
  {name: 'Boiler Phospate test Kid', unit: 'Boxes'},
  {name: 'Chlorate LMP Test Kid', unit: 'Boxes'},
  {name: 'Full Range PH Strip', unit: 'Boxes'},
  {name: 'Arcel', unit: 'Liters'},
  {name: 'etc', unit: ''}
];

const tbody = document.getElementById('rows');
items.forEach(item => {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="row-label">${item.name}</td>
    <td>${item.unit || '<input type="text">'}</td>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="text"></td>
    <td><input type="text"></td>
  `;
  tbody.appendChild(tr);
});

function mask(e) {
  let v = e.target.value.replace(/\D/g, '');
  if (v.length > 2) v = v.slice(0,2) + '-' + v.slice(2);
  if (v.length > 5) v = v.slice(0,5) + '-' + v.slice(5,9);
  e.target.value = v;
}
document.querySelector('.date-mask').addEventListener('input', mask);

const roles=[['Reported by Chief Engineer/Officer'],['Checked by Master'],['Rechecked by SI / FM']],box=document.getElementById('signatures');roles.forEach(([a])=>{const s=document.createElement('div');s.className='sign-box';s.innerHTML=`<div style="font-weight:bold">${a}</div><div class="sig-space"><label class="btn no-print">+ Add TTD<input class="upload hidden" type="file" accept="image/*"></label><div class="sig-preview hidden"><img alt=""><button class="remove no-print" type="button">×</button></div></div><input class="sig-name" type="text" placeholder="Name"><div class="role">Signed & Name</div>`;box.appendChild(s);const up=s.querySelector('.upload'),pv=s.querySelector('.sig-preview'),lab=s.querySelector('.btn'),im=pv.querySelector('img');up.onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=x=>{im.src=x.target.result;lab.classList.add('hidden');pv.classList.remove('hidden');};r.readAsDataURL(f)};s.querySelector('.remove').onclick=()=>{im.src='';up.value='';pv.classList.add('hidden');lab.classList.remove('hidden')}});


function parseNum(val) { const n = parseFloat(val); return isNaN(n) ? 0 : n; }
const tbodyE = document.getElementById('rows');
if (tbodyE) {
  function calcE() {
    tbodyE.querySelectorAll('tr').forEach(tr => {
      const inputs = tr.querySelectorAll('input[type="text"]');
      if (inputs.length >= 6) {
        // inputs[0] is unit (maybe)
        // inputs[1] is ROB Last Month
        // inputs[2] is Last Supply
        // inputs[3] is Consumption
        // inputs[4] is ROB this month (FULL)
        // inputs[5] is ROB this month (EMPTY)
        
        // Wait, the columns are: Kind | Satuan | Last Month | Last Supply | Consumption | FULL | EMPTY
        // inputs[0] is in td[1]
        const last = parseNum(inputs[1].value);
        const sup = parseNum(inputs[2].value);
        const cons = parseNum(inputs[3].value);
        
        const rob = last + sup - cons;
        // inputs[4].value = rob ? rob.toFixed(2) : ''; 
        // Not auto-filling because FULL and EMPTY might be separate physical counts.
      }
    });
  }
  tbodyE.querySelectorAll('input').forEach(inp => inp.addEventListener('input', calcE));
}

</script>
</body>
</html>
