<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>091-E Crew Repatriation or Contract Extension Request</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #e5e7eb; font-family: Arial; font-size: 12px; }
        .page { max-width: 900px; margin: 20px auto; background: white; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tools { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .btn { border: 0; border-radius: 6px; padding: 10px 20px; color: white; font-weight: bold; background: #1769d2; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn:hover { background: #1d4ed8; }
        
        .head { border: 2px solid; padding: 8px; margin-bottom: 20px; }
        .top { display: grid; grid-template-columns: 25% 50% 25%; border-bottom: 2px solid; min-height: 82px; margin-bottom: 10px; padding-bottom: 10px; }
        .co { font-weight: bold; }
        .ttl { text-align: center; font-weight: bold; font-size: 14px; text-transform: uppercase; }
        .stat { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 11px; }
        .box { display: flex; border: 1px solid; }
        .box span { padding: 5px 8px; }
        .box span+span { border-left: 1px solid; }
        
        .row { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
        .row label { width: 150px; font-weight: bold; }
        .row input, .row select { flex: 1; padding: 4px; border: 0; border-bottom: 1px solid black; background: transparent; outline: none; font-size: 12px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .section-box { border: 1px solid #111; padding: 15px; background: #f9fafb; margin-bottom: 20px; }
        .section-title { font-weight: bold; font-size: 13px; text-align: center; margin-bottom: 15px; text-decoration: underline; }
        
        .comment-box { margin-bottom: 15px; }
        .comment-box label { font-weight: bold; display: block; margin-bottom: 5px; }
        .comment-box textarea { width: 100%; height: 60px; padding: 8px; border: 1px solid #ccc; outline: none; resize: vertical; font-family: inherit; font-size: 12px; }
        
        .footer-sigs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 30px; gap: 15px; text-align: center; font-weight: bold; }
        .sig-box { display: flex; flex-direction: column; justify-content: flex-end; }
        .sig-box input { border: 0; border-bottom: 1px solid black; width: 100%; text-align: center; margin-top: 5px; outline: none; background: transparent; font-size: 12px; }
        
        .hidden { display: none !important; }
        .sigimg { max-height: 60px; max-width: 100%; }
        
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            .no-print { display: none !important; }
            body { background: white; }
            .page { margin: 0; padding: 0; box-shadow: none; max-width: 100%; }
            .section-box { background: white; border: 1px solid #000; }
            .comment-box textarea { border: 0; border-bottom: 1px dotted #ccc; min-height: 40px; }
            .row input, .row select { border-bottom: 1px dotted #ccc; }
        }
    </style>

<style id="global-print-fix">
@media print {
    input::-webkit-input-placeholder, 
    input::-moz-placeholder, 
    input:-ms-input-placeholder, 
    input::placeholder {
        color: transparent !important;
        opacity: 0 !important;
    }
    select {
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        appearance: none !important;
        background-image: none !important;
        background-color: transparent !important;
        border: none !important;
    }
    /* Specifically for bottom-border selects if they were styled */
    select { border-bottom: 1px dotted #000 !important; }
    /* Some selects have border: 0 */
    .tbl select { border: 0 !important; border-bottom: 0 !important; }
}
</style>
</head>
<body>
    <div class="page">
        <!-- Print Button -->
        <div class="tools no-print">
            <button id="btn-print" class="btn" onclick="saveAndPrint()">
                📄 Print / Simpan PDF
            </button>
        </div>

        <!-- Header -->
        <div class="head">
            <div class="top">
                <div class="co">PT MENTARI MAS MULTIMODA</div>
                <div class="ttl">091-E<br>CREW REPATRIATION OR CONTRACT EXTENSION REQUEST</div>
                <div class="stat">
                    <div class="box"><span>CS</span><span>SET</span></div>
                    <div>Release: Rev.01</div>
                </div>
            </div>
            
            <div class="row">
                <label>To :</label>
                <input type="text" value="Crewing Department" readonly>
            </div>
            <div class="row">
                <label>From Crew (Name) :</label>
                <input type="text" id="crew_name">
            </div>
            <div class="row">
                <label>Date :</label>
                <input type="date" id="report_date">
            </div>
        </div>

        <div class="grid-2">
            <div>
                <div class="row"><label>Rank:</label><input type="text" id="rank"></div>
                <div class="row"><label>Vessel:</label>
                    <select class="ship-select" id="vessel_name" style="border-bottom: 1px solid black;">
                        <option value="">Pilih Kapal</option>
                        <option>Sahabat Mas</option>
                        <option>Semangat Mas</option>
                        <option>Express Mas</option>
                        <option>Pratama Mas</option>
                        <option>Prakarsa Mas</option>
                        <option>Mavendra Mas</option>
                        <option>Selaras Mas</option>
                        <option>Segoro Mas</option>
                    </select>
                </div>
                <div class="row"><label>Seaman Book No:</label><input type="text" id="seaman_book"></div>
            </div>
            <div>
                <div class="row"><label>Port:</label><input type="text" id="port"></div>
                <div class="row"><label>Sign Onboard (Date/Time):</label><input type="datetime-local" id="sign_onboard"></div>
                <div class="row"><label>Total Working Day:</label><input type="text" id="total_working_day"></div>
            </div>
        </div>

        <div style="font-weight:bold; margin-bottom: 10px; color: red;" class="no-print">* Choose one to fill (Repatriation OR Contract Extension)</div>
        
        <div class="grid-2">
            <!-- REPATRIATION -->
            <div class="section-box">
                <div class="section-title">REPATRIATION</div>
                <div class="row"><label style="width:130px;">Expected Date:</label><input type="date" id="rep_expected_date"></div>
                <div class="row"><label style="width:130px;">Leave Pay Entitlement:</label><input type="text" id="rep_leave_pay"></div>
                <div class="row"><label style="width:130px;">Reason Of Request:</label><input type="text" id="rep_reason"></div>
                <div class="row"><label style="width:130px;">Expected Date Re-Join:</label><input type="date" id="rep_rejoin_date"></div>
                <div class="row"><label style="width:130px;">Duration Of Leave:</label><input type="text" id="rep_leave_duration"></div>
            </div>
            
            <!-- CONTRACT EXTENSION -->
            <div class="section-box">
                <div class="section-title">CONTRACT EXTENSION</div>
                <div class="row"><label style="width:150px;">Due date of agreement:</label><input type="date" id="ext_due_date"></div>
                <div class="row"><label style="width:150px;">Extension (in months):</label><input type="text" id="ext_months"></div>
                <div class="row"><label style="width:150px;">Reason Of Extension:</label><input type="text" id="ext_reason"></div>
                <div class="row"><label style="width:150px;">Total contract (months):</label><input type="text" id="ext_total_contract"></div>
            </div>
        </div>

        <div class="comment-box">
            <label>Comment from Head of Department:</label>
            <textarea id="comment_hod"></textarea>
        </div>
        <div class="comment-box">
            <label>Comment from Master:</label>
            <textarea id="comment_master"></textarea>
        </div>
        <div class="comment-box">
            <label>Comment from Office (Crewing, SI, FM):</label>
            <textarea id="comment_office"></textarea>
        </div>
        <div class="comment-box">
            <label>Notes / Catatan:</label>
            <textarea id="notes"></textarea>
        </div>

        <div class="footer-sigs">
            <!-- CREW -->
            <div class="sig-box">
                <div style="margin-bottom:10px;">Crew</div>
                <div class="space pv-container" style="position:relative; display:flex; justify-content:center; align-items:center; min-height:70px;">
                    <label class="btn no-print" style="padding:5px 8px;font-size:9px">+ Add TTD<input class="hidden sig-upload" data-target="sig1" type="file" accept="image/*"></label>
                    <div class="pv hidden" style="display:none; position:relative;">
                        <img id="sig1" class="sigimg">
                        <button class="x no-print" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;" onclick="clearSig('sig1')">×</button>
                    </div>
                </div>
                <input type="text" id="sig1_name" placeholder="Sign & Name">
            </div>
            
            <!-- MASTER -->
            <div class="sig-box">
                <div style="margin-bottom:10px;">Approved by: Master</div>
                <div class="space pv-container" style="position:relative; display:flex; justify-content:center; align-items:center; min-height:70px;">
                    <label class="btn no-print" style="padding:5px 8px;font-size:9px">+ Add TTD<input class="hidden sig-upload" data-target="sig2" type="file" accept="image/*"></label>
                    <div class="pv hidden" style="display:none; position:relative;">
                        <img id="sig2" class="sigimg">
                        <button class="x no-print" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;" onclick="clearSig('sig2')">×</button>
                    </div>
                </div>
                <input type="text" id="sig2_name" placeholder="Sign & Name">
            </div>
            
            <!-- SI/FM -->
            <div class="sig-box">
                <div style="margin-bottom:10px;">Approved by: SI/FM</div>
                <div class="space pv-container" style="position:relative; display:flex; justify-content:center; align-items:center; min-height:70px;">
                    <label class="btn no-print" style="padding:5px 8px;font-size:9px">+ Add TTD<input class="hidden sig-upload" data-target="sig3" type="file" accept="image/*"></label>
                    <div class="pv hidden" style="display:none; position:relative;">
                        <img id="sig3" class="sigimg">
                        <button class="x no-print" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;" onclick="clearSig('sig3')">×</button>
                    </div>
                </div>
                <input type="text" id="sig3_name" placeholder="Sign & Name">
            </div>
            
            <!-- Head of Crewing -->
            <div class="sig-box">
                <div style="margin-bottom:10px;">Approved by: Head of Crewing</div>
                <div class="space pv-container" style="position:relative; display:flex; justify-content:center; align-items:center; min-height:70px;">
                    <label class="btn no-print" style="padding:5px 8px;font-size:9px">+ Add TTD<input class="hidden sig-upload" data-target="sig4" type="file" accept="image/*"></label>
                    <div class="pv hidden" style="display:none; position:relative;">
                        <img id="sig4" class="sigimg">
                        <button class="x no-print" style="position:absolute; top:-5px; right:-5px; background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;" onclick="clearSig('sig4')">×</button>
                    </div>
                </div>
                <input type="text" id="sig4_name" placeholder="Sign & Name">
            </div>
        </div>

    </div>

    <script>
        let SUPA_URL = "";
        let SUPA_KEY = "";
        const FORM_CODE = "091E";
        const shipSelect = document.getElementById('vessel_name');

        const inputsToSave = [
            'crew_name', 'report_date', 'rank', 'seaman_book', 'port', 'sign_onboard', 'total_working_day',
            'rep_expected_date', 'rep_leave_pay', 'rep_reason', 'rep_rejoin_date', 'rep_leave_duration',
            'ext_due_date', 'ext_months', 'ext_reason', 'ext_total_contract',
            'comment_hod', 'comment_master', 'comment_office', 'notes',
            'sig1_name', 'sig2_name', 'sig3_name', 'sig4_name'
        ];

        
        function loadSig(id, val) {
            let img = document.getElementById(id);
            if(img) {
                img.src = val || '';
                let c = img.closest('.pv-container');
                if(c) {
                    if(val) {
                        c.querySelector('label').style.display='none';
                        c.querySelector('.pv').style.display='block';
                    } else {
                        c.querySelector('label').style.display='inline-flex';
                        c.querySelector('.pv').style.display='none';
                    }
                }
            }
        }

        function clearSig(id){
            let img = document.getElementById(id);
            img.src='';
            let c=img.closest('.pv-container');
            if(c){
                c.querySelector('.pv').style.display='none';
                c.querySelector('label').style.display='inline-flex';
                c.querySelector('.sig-upload').value='';
            }
        }

        document.querySelectorAll('.sig-upload').forEach(x=>x.onchange=e=>{
            if(!e.target.files[0])return;
            const r=new FileReader();
            r.onload=a=>{
                document.getElementById(x.dataset.target).src=a.target.result;
                let c=x.closest('.pv-container');
                if(c){
                    c.querySelector('label').style.display='none';
                    c.querySelector('.pv').style.display='block';
                }
            };
            r.readAsDataURL(e.target.files[0])
        });

        
        async function saveAndPrint() {
            const vessel = shipSelect.value;
            if (!vessel) { 
                alert('Pilih Kapal terlebih dahulu!'); 
                return; 
            }

            const btn = document.getElementById('btn-print');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '⏳ Menyimpan...'; 
            btn.disabled = true;

            const fd = {};
            inputsToSave.forEach(id => { fd[id] = document.getElementById(id).value; });
            ['sig1', 'sig2', 'sig3', 'sig4'].forEach(id => fd[id] = document.getElementById(id).src || '');

                            btn.innerHTML = '\u2705 Berhasil! Membuat PDF...';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;

                    window.parent.postMessage({
                        type: 'SMK_SAVE_PDF',
                        name: document.title,
                        ship: vesselName,
                        date: placeDate.split(',').pop().trim() || '', // rough date extraction
                        formCode: FORM_CODE,
                        formTitle: document.title
                    }, '*');
                }, 500);
        }

        // Auto mirror Crew Name to Sig 1
        document.getElementById('crew_name').addEventListener('input', function() {
            document.getElementById('sig1_name').value = this.value;
        });

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'INIT_FORM') {

                if (e.data.vessel) {
                    const vLower = (e.data.vessel || '').toLowerCase().replace(/_/g,' ');
                    Array.from(shipSelect.options).forEach(opt => {
                        if (opt.value.toLowerCase().replace(/_/g,' ') === vLower) shipSelect.value = opt.value;
                    });
                }
                if (e.data.locked) shipSelect.disabled = true;
                
                if (shipSelect.value) loadFromSupabase();
            }
        });

        
    </script>
</body>
</html>
