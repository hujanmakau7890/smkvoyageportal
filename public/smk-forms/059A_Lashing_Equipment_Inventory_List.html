<section class="foot" id="signatures"></section></div><script>
const labels=['Code of Lashing Equipments *\nKode Peralatan Lashing','Original Yard Supply / As Cargo Securing Manual\nPasokan dari Galangan / berdasarkan Manual Pengaman','Remain On Board (ROB) - Good Condition\nPersediaan di atas kapal - Kondisi Baik','Supply (This Month)\nPenambahan (pada bulan laporan)','Damage / Rusak','Loss / Hilang','Compliance ROB with Cargo Securing Manual **\nPemenuhan ROB dengan Manual Pengaman Muatan','Location / Lokasi'];const tbody=document.getElementById('rows');labels.forEach((label,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="row-label">${label.replace('\n','<br>')}</td>${Array.from({length:12},()=>`<td><input class="cell ${i===7?'location':''}" type="text"></td>`).join('')}`;tbody.appendChild(tr)});
function mask(e){let v=e.target.value.replace(/\D/g,'').slice(0,8);if(v.length>2)v=v.slice(0,2)+'-'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'-'+v.slice(5);e.target.value=v}document.querySelector('.date-mask').oninput=mask;document.querySelectorAll('.editable-head').forEach(t=>t.oninput=()=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'});
const roles=[['Reported by Chief Officer','Dilaporkan oleh Mualim I'],['Checked by Master','Diperiksa oleh Nakhoda'],['Recheck by SI / FM','Diperiksa kembali oleh SI / FM']],box=document.getElementById('signatures');roles.forEach(([a,b])=>{const s=document.createElement('div');s.innerHTML=`<div class="sig-title">${a}<br>${b}</div><div class="sig-space"><label class="btn no-print">+ Add TTD<input class="upload hidden" type="file" accept="image/*"></label><div class="sig-preview hidden"><img alt=""><button class="remove no-print" type="button">×</button></div></div><input class="sig-name" type="text"><div class="role">Signed & Name</div>`;box.appendChild(s);const up=s.querySelector('.upload'),pv=s.querySelector('.sig-preview'),lab=s.querySelector('.btn'),im=pv.querySelector('img');up.onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=x=>{im.src=x.target.result;lab.classList.add('hidden');pv.classList.remove('hidden');pv.style.display='flex'};r.readAsDataURL(f)};s.querySelector('.remove').onclick=()=>{im.src='';up.value='';pv.classList.add('hidden');pv.style.display='none';lab.classList.remove('hidden')}});
