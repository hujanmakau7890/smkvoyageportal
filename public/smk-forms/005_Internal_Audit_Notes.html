<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>005 Internal Audit Notes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e7eb;font-family:Arial,sans-serif;color:#111}.page{max-width:1200px;margin:20px auto;background:#fff;padding:24px;box-shadow:0 3px 14px #999}.toolbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:18px}.btn{border:0;border-radius:6px;color:#fff;font-weight:700;padding:10px 15px;cursor:pointer}.add{background:#15803d}.del{background:#dc2626}.print{background:#1769d2}.header{border:2px solid #000;padding:8px;margin-bottom:12px}.header-top{display:grid;grid-template-columns:25% 50% 25%;align-items:start;border-bottom:2px solid #000;padding:4px 0 10px;min-height:76px}.company{font-size:14px;font-weight:700;text-transform:uppercase}.title{text-align:center;font-size:15px;font-weight:700;line-height:1.3}.status-area{display:flex;flex-direction:column;align-items:flex-end;gap:9px;padding-right:14px;font-size:11px;min-height:66px}.status-box{display:inline-flex;border:1px solid #000;font-weight:700}.status-box span{padding:5px 8px;white-space:nowrap}.status-box span+span{border-left:1px solid #000}.release{width:100%;text-align:right;white-space:nowrap;padding-right:2px}.table-wrap{width:100%;overflow-x:auto}table{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #000;text-align:center;vertical-align:middle;padding:3px;font-size:10px}th{background:#f3f4f6}.c-no{width:5%}.c-audit{width:12%}.c-unit{width:17%}.c-auditor{width:15%}.c-date{width:13%}.c-result{width:26%}.c-status{width:12%}.cell,.area{display:block;width:100%;min-height:32px;border:0;outline:0;background:transparent;text-align:center;padding:4px;font:inherit}.area{resize:none;overflow:hidden;text-align:left}.date-mask{text-align:center}.signature-section{display:flex;justify-content:flex-end;margin-top:24px}.signature{width:290px;text-align:center}.sig-space{height:85px;display:flex;align-items:center;justify-content:center;position:relative}.ttd{background:#1769d2}.sig-preview{display:none;position:relative;width:100%;height:100%;align-items:center;justify-content:center}.sig-preview img{max-width:100%;max-height:74px;object-fit:contain}.remove-sig{position:absolute;right:0;top:0;width:18px;height:18px;border:0;border-radius:50%;background:#dc2626;color:#fff;font-weight:700;line-height:18px;padding:0}.name{width:100%;border:0;border-bottom:1px solid #000;text-align:center;outline:0;padding:4px}.caption{font-size:10px;font-weight:700;margin-top:3px}.hidden{display:none!important}
@media(max-width:768px){.page{margin:0;padding:12px;box-shadow:none}.header-top{display:flex;flex-direction:column;align-items:center;gap:8px}.company,.title,.status-area{width:100%;text-align:center}.status-area{align-items:flex-end;padding-right:12px}.release{text-align:right}.signature-section{justify-content:center}.signature{width:100%}.btn{padding:9px;font-size:12px}}
@media print{@page{size:A4 landscape;margin:8mm}.no-print{display:none!important}html,body{width:100%;margin:0;padding:0;background:#fff}.page{width:100%;max-width:none;margin:0;padding:0;box-shadow:none}.header-top{display:grid!important;grid-template-columns:25% 50% 25%!important}.company{text-align:left!important}.title{text-align:center!important}.status-area{align-items:flex-end!important;padding-right:14px!important}.table-wrap{overflow:visible!important}table{width:99.5%!important;min-width:0!important;margin:auto;table-layout:fixed!important}th,td{font-size:8px!important;padding:1px!important;word-break:break-word;overflow:hidden}.cell,.area{width:100%!important;min-width:0!important;min-height:22px!important;border:0!important;padding:1px!important;font-size:8px!important;background:transparent!important}.area{height:auto!important;overflow:hidden!important}.cell::placeholder,.area::placeholder{color:transparent!important;opacity:0!important}.signature-section{margin-top:12px}.sig-space{height:62px}.sig-preview:not(.hidden){display:flex!important}.sig-preview.hidden{display:none!important}.sig-preview img{max-height:55px}.name,.caption{font-size:8px}}
</style>
</head>
<body>
<div class="page">
<div class="toolbar no-print"><button class="btn add" id="addRow">+ Tambah Baris</button><button class="btn del" id="deleteRow">− Hapus Baris Terakhir</button><button class="btn print" onclick="window.print()">🖨 Print / Simpan PDF</button></div>
<header class="header"><div class="header-top"><div class="company">PT Mentari Mas Multimoda</div><div class="title">005 &nbsp; CATATAN INTERNAL AUDIT<br><span style="font-size:11px;font-weight:normal">INTERNAL AUDIT NOTES</span></div><div class="status-area"><div class="status-box"><span>CS</span><span>SET</span></div><div class="release">Release : &nbsp;&nbsp; Rev. 0 :</div></div></div></header>
<div class="table-wrap"><table><thead><tr><th class="c-no">No.<br><span>No.</span></th><th class="c-audit">No. Audit<br><span>Audit No</span></th><th class="c-unit">Unit Kerja<br><span>Work Unit</span></th><th class="c-auditor">Auditor<br><span>Auditor</span></th><th class="c-date">Tanggal<br><span>Date</span></th><th class="c-result">Hasil Audit<br><span>Audit Results</span></th><th class="c-status">Status<br><span>Status</span></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="signature-section"><section class="signature"><div class="caption">Prepared by / Dibuat oleh</div><div class="sig-space sig-container"><label class="btn ttd no-print">+ Add TTD<input class="sig-upload hidden" type="file" accept="image/*"></label><div class="sig-preview hidden"><img alt=""><button class="remove-sig no-print" type="button">×</button></div></div><input class="name" type="text"><div class="caption">Auditor</div></section></div>
</div>
<script>
const tbody=document.getElementById('rows');
function grow(x){x.style.height='auto';x.style.height=x.scrollHeight+'px'}
function addRow(no=''){const tr=document.createElement('tr');tr.innerHTML=`<td><input class="cell" type="text" value="${no}"></td><td><input class="cell" type="text"></td><td><textarea class="area" rows="1"></textarea></td><td><textarea class="area" rows="1"></textarea></td><td><input class="cell date-mask" type="text" placeholder="DD-MM-YYYY"></td><td><textarea class="area" rows="1"></textarea></td><td><input class="cell" type="text"></td>`;tbody.appendChild(tr);tr.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',()=>grow(t)));const d=tr.querySelector('.date-mask');d.addEventListener('input',()=>{let v=d.value.replace(/\D/g,'').slice(0,8);if(v.length>2)v=v.slice(0,2)+'-'+v.slice(2);if(v.length>5)v=v.slice(0,5)+'-'+v.slice(5);d.value=v})}
for(let i=1;i<=15;i++)addRow(i);
document.getElementById('addRow').onclick=()=>addRow('');document.getElementById('deleteRow').onclick=()=>{const r=tbody.querySelectorAll('tr');if(r.length>1)r[r.length-1].remove()};
const up=document.querySelector('.sig-upload'),pv=document.querySelector('.sig-preview'),lab=document.querySelector('.ttd'),im=pv.querySelector('img');up.onchange=e=>{const f=e.target.files[0];if(!f||!f.type.startsWith('image/'))return;const rd=new FileReader();rd.onload=x=>{im.src=x.target.result;lab.classList.add('hidden');pv.classList.remove('hidden');pv.style.display='flex'};rd.readAsDataURL(f)};document.querySelector('.remove-sig').onclick=()=>{im.src='';up.value='';pv.classList.add('hidden');pv.style.display='none';lab.classList.remove('hidden')};
  // Print title: base + vessel + report month (from form fields)
  (function(){try{
    var base=document.title;
    function esc(s){return (s||'').replace(/\s+/g,' ').trim()}
    function findVessel(){
      var d=document.querySelector('input.vessel,select.vessel');
      if(d)return d;
      var els=document.querySelectorAll('label.f,label.field');
      for(var i=0;i<els.length;i++){var t=(els[i].textContent||'').toLowerCase();
        if(/vessel|kapal|nama kapal|ship'?s? name|name of vessel/.test(t)){
          var inp=els[i].querySelector('input,select');if(inp)return inp}}
      return null}
    function findDate(){
      var d=document.querySelector('input.date');
      if(d)return d;
      var els=document.querySelectorAll('label.f,label.field');
      for(var i=0;i<els.length;i++){var t=(els[i].textContent||'').toLowerCase();
        if(/date|tanggal/.test(t)){
          var inp=els[i].querySelector('input');if(inp)return inp}}
      return null}
    function monthName(mm){return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][mm-1]||''}
    function updateTitle(){
      var v=findVessel(),d=findDate();
      var vs=v?esc(v.value):'';var ds=d?esc(d.value):'';
      var t=base;
      if(vs)t+=' - '+vs;
      if(ds){var m=ds.match(/^(\d{2})-(\d{2})-(\d{4})$/);
        if(m){var mo=parseInt(m[2],10),yr=m[3];
          if(mo>=1&&mo<=12)t+=' - '+monthName(mo)+' '+yr}else t+=' - '+ds}
      document.title=t;
      window.parent&&window.parent.postMessage({type:'FORM_TITLE',title:t},'*')}
    var v=findVessel(),d=findDate();
    if(v){v.addEventListener('change',updateTitle);v.addEventListener('input',updateTitle)}
    if(d){d.addEventListener('change',updateTitle);d.addEventListener('input',updateTitle)}
    updateTitle();
  }catch(e){window.parent&&window.parent.postMessage({type:'FORM_TITLE',title:document.title},'*')}})();
</script>
</body>
</html>
