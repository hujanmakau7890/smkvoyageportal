<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>087-A Master Note of Protest</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #e5e7eb; font-family: Arial; }
        .page { max-width: 900px; margin: 20px auto; background: white; padding: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .tools { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .btn { border: 0; border-radius: 6px; padding: 10px 20px; color: white; font-weight: bold; background: #1769d2; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .head { border: 2px solid; padding: 8px; margin-bottom: 20px; }
        .top { display: grid; grid-template-columns: 25% 50% 25%; border-bottom: 2px solid; min-height: 82px; margin-bottom: 10px; padding-bottom: 10px; }
        .co { font-weight: bold; }
        .ttl { text-align: center; font-weight: bold; font-size: 16px; }
        .stat { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; font-size: 11px; }
        .box { display: flex; border: 1px solid; }
        .box span { padding: 5px 8px; }
        .box span+span { border-left: 1px solid; }
        
        .field-group { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .field-group label { width: 100px; font-weight: bold; }
        .field-group input, .field-group select { flex: 1; padding: 5px; border: 0; border-bottom: 1px solid black; background: transparent; outline: none; }
        
        .body-text { margin-top: 30px; line-height: 1.6; }
        .inline-input { border: 0; border-bottom: 1px solid black; outline: none; text-align: center; font-weight: bold; background: transparent; }
        
        textarea { width: 100%; height: 300px; padding: 10px; margin-top: 20px; border: 1px solid #ccc; outline: none; resize: vertical; line-height: 1.5; font-family: inherit; }
        
        .footer-sigs { display: grid; grid-template-columns: 1fr 1fr; margin-top: 50px; gap: 20px; }
        .sig-box { text-align: center; }
        .sig-box input { border: 0; border-bottom: 1px solid black; width: 80%; text-align: center; margin-top: 10px; outline: none; background: transparent; }
        
        .hidden { display: none !important; }
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            .no-print { display: none !important; }
            body { background: white; }
            .page { margin: 0; padding: 0; box-shadow: none; max-width: 100%; }
            textarea { border: 0; height: auto; min-height: 200px; }
            .field-group select { appearance: none; -webkit-appearance: none; }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Print Button -->
        <div class="tools no-print">
            <button id="btn-print" class="btn" onclick="aksiSimpanDanCetak()">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                Print / Simpan PDF
            </button>
        </div>

        <!-- Header -->
        <div class="head">
            <div class="top">
                <div class="co">PT MENTARI MAS MULTIMODA</div>
                <div class="ttl">087<br>MASTER NOTE OF PROTEST</div>
                <div class="stat">
                    <div class="box"><span>CS</span><span>SET</span></div>
                    <div>Release: Rev.0</div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="field-group">
                    <label>MV:</label>
                    <select class="ship-select">
                        <option value="">Pilih Kapal</option>
                        <option>Sahabat Mas</option>
                        <option>Semangat Mas</option>
                        <option>Express Mas</option>
                        <option>Pratama Mas</option>
                        <option>Prakarsa Mas</option>
                        <option>Mavendra Mas</option>
                        <option>Selaras Mas</option>
                        <option>Segoro Mas</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>Place, Date:</label>
                    <input type="text" id="place_date" placeholder="Place, DD-MM-YYYY">
                </div>
            </div>
        </div>

        <div class="field-group">
            <label>Attention</label><span>:</span>
            <input type="text" id="attention">
        </div>
        <div class="field-group">
            <label>CC</label><span>:</span>
            <input type="text" id="cc">
        </div>
        <div class="field-group">
            <label>Re</label><span>:</span>
            <input type="text" id="re">
        </div>

        <div class="body-text">
            <p>I, Captain <input type="text" id="master_name" class="inline-input" style="width: 200px;" placeholder="Master's Name">, 
               Master of M.V. <input type="text" id="vessel_name_inline" class="inline-input" style="width: 150px;" readonly> 
               declare that :</p>
            
            <textarea id="declaration" placeholder="Type your declaration here..."></textarea>
        </div>

        <div class="footer-sigs">
            <div class="sig-box">
                <div style="text-align: left; margin-bottom: 20px;">Party and time this notice accepted by</div>
                <div style="height: 60px;"></div>
                <div>Name : <input type="text" id="accepted_by" style="width: 150px;"></div>
            </div>
            <div class="sig-box">
                <div style="text-align: right; margin-bottom: 20px;">Yours faithfully,</div>
                <div style="height: 60px;"></div>
                <div>Master of MV. <input type="text" id="sig_vessel_name" class="inline-input" style="width: 120px;" readonly></div>
                <div>Name : <input type="text" id="sig_master_name" style="width: 150px;"></div>
            </div>
        </div>
    </div>

    <script>
        // === SUPABASE CONFIG ===
        let SUPA_URL  = "";
        let SUPA_KEY  = "";
        const FORM_CODE = "087A";

        
        // Sync inputs
        const shipSelect = document.querySelector('.ship-select');
        const vInline = document.getElementById('vessel_name_inline');
        const sigVessel = document.getElementById('sig_vessel_name');
        
        const mName = document.getElementById('master_name');
        const sigMName = document.getElementById('sig_master_name');

        shipSelect.addEventListener('change', () => {
            vInline.value = shipSelect.value;
            sigVessel.value = shipSelect.value;
        });

        mName.addEventListener('input', () => { sigMName.value = mName.value; });
        sigMName.addEventListener('input', () => { mName.value = sigMName.value; });


        // === SAVE & PRINT ===
        async function aksiSimpanDanCetak() {
            const vesselName = shipSelect.value;
            if (!vesselName) { 
                alert('Pilih Kapal terlebih dahulu sebelum Print/Simpan!'); 
                return; 
            }

            const btn = document.getElementById('btn-print');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '⏳ Menyimpan...'; 
            btn.disabled = true;

            const placeDate = document.getElementById('place_date').value;

                            btn.innerHTML = '\u2705 Berhasil! Membuat PDF...';
                setTimeout(() => {
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;

                    window.parent.postMessage({
                        type: 'SMK_SAVE_PDF',
                        name: document.title,
                        ship: vesselName,
                        date: placeDate.split(',').pop().trim() || '', // rough date extraction
                        formCode: FORM_CODE,
                        formTitle: document.title
                    }, '*');
                }, 500);
        }

        // === INIT DATA FROM REACT (terima dari React via postMessage) ===
        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'INIT_FORM') {

                const sel = document.querySelector('.ship-select');
                if (e.data.vessel) {
                    const vLower = (e.data.vessel || '').toLowerCase().replace(/_/g,' ');
                    Array.from(sel.options).forEach(opt => {
                        if (opt.value.toLowerCase().replace(/_/g,' ') === vLower) sel.value = opt.value;
                    });
                }
                if (e.data.locked) sel.disabled = true;
                
                
            }
        });

        shipSelect.addEventListener('change', () => {
            vInline.value = shipSelect.value;
            sigVessel.value = shipSelect.value;
        });
    </script>
</body>
</html>
