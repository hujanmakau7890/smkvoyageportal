<!doctype html>
<html lang="id">
  <head>
<script>
  window.addEventListener('error', function(event) {
    var err = document.createElement('div');
    err.style.position = 'fixed';
    err.style.top = '0';
    err.style.left = '0';
    err.style.width = '100%';
    err.style.zIndex = '99999';
    err.style.background = 'red';
    err.style.color = 'white';
    err.style.padding = '20px';
    err.style.whiteSpace = 'pre-wrap';
    err.style.overflow = 'auto';
    err.innerText = 'Global Error: ' + event.message + '\n' + (event.error ? event.error.stack : '');
    document.body.appendChild(err);
  });
</script>
